<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0D3D2E"/>
<title>PawSociety</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.30.0/iconfont/tabler-icons.min.css"/>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#f5f6f8;font-family:'Inter',system-ui,sans-serif;}
  #root{min-height:100vh;}

  /* Smooth transitions on interactive elements */
  button{transition:all .15s ease;outline:none;}
  button:active{transform:scale(.97);}
  input,select,textarea{font-family:'Inter',sans-serif;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:#1A5C47 !important;outline:none;}

  /* Sidebar nav buttons hover */
  .sidebar-btn:hover{
    background:rgba(242,196,206,.1) !important;
    color:rgba(242,196,206,.85) !important;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}

  /* Card hover effect */
  .paw-card{transition:box-shadow .2s,transform .2s;}
  .paw-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);}

  /* Smooth page transitions */
  #root > div{animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:.7;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Bottom tab active indicator */
  .tab-active{position:relative;}
  .tab-active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:#F2C4CE;border-radius:2px;}

  /* Elegant selection */
  ::selection{background:#D4945A33;color:#0D3D2E;}

  /* Better inputs */
  input[type="date"],input[type="month"],input[type="time"]{cursor:pointer;}
  select{cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
